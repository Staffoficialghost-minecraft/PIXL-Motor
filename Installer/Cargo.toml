[package]
name = "pixl-motor-installer"
version = "0.1.0"
edition = "2024"
description = "PIXL Motor Installer"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = "2"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
mockito = "1"
