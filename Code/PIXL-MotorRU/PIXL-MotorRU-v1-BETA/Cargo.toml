[package]
name = "pixl-motorru"
version = "0.1.0"
edition = "2024"
description = "PIXL MotorRU native Rust implementation"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:egui_extras"]

[dependencies]
eframe = { version = "0.29", optional = true, default-features = true }
egui_extras = { version = "0.29", optional = true, features = ["svg"] }
rfd = { version = "0.15", optional = true }

[build-dependencies]
winresource = "0.1"

[lib]
name = "pixl_motorru"
path = "src/lib.rs"

[[bin]]
name = "pixl-motorru"
path = "src/main.rs"
