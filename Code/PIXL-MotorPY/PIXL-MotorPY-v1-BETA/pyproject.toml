[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixl-motorpy"
version = "0.1.0"
description = "PIXL MotorPY language parser and renderer"
requires-python = ">=3.10"
dependencies = ["pixl-motorpy-core>=0.1.0"]

[project.scripts]
pixl = "main:main"

[tool.setuptools]
packages = ["pixl", "pixl.renderers"]
py-modules = ["main"]
